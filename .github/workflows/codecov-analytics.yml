name: Codecov Analytics

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecov-analytics:
    name: Codecov Analytics
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: '20'

      - name: Validate Codecov token
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "Missing CODECOV_TOKEN" >&2
            exit 1
          fi

      - name: Collect coverage artifacts
        run: |
          set -euo pipefail
          npm --prefix airline-gui ci
          npm --prefix airline-gui test -- --coverage --watch=false
          bash scripts/verify
          python3 -m venv .venv-gcovr
          . .venv-gcovr/bin/activate
          python -m pip install --disable-pip-version-check gcovr
          mkdir -p coverage/cpp
          gcovr \
            --root . \
            --filter 'src' \
            --exclude 'tests' \
            --object-directory build \
            --merge-mode-functions=merge-use-line-min \
            --gcov-exclude-directory '.*/CMakeFiles/airline_api_server.dir/.*' \
            --gcov-exclude-directory '.*/CMakeFiles/airline_reservation_system.dir/.*' \
            --lcov coverage/cpp/lcov.info \
            --print-summary
          cp coverage/cpp/lcov.info coverage/cpp/lcov.raw.info
          python3 -m scripts.quality.normalize_lcov < coverage/cpp/lcov.raw.info > coverage/cpp/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: airline-gui/coverage/lcov.info,coverage/cpp/lcov.info
          flags: node,cpp
          fail_ci_if_error: true
          verbose: true
