name: Codecov Analytics

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecov-analytics:
    name: Codecov Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      CODACY_ORGANIZATION_PROVIDER: gh
      CODACY_USERNAME: Prekzursil
      CODACY_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'

      - name: Run node coverage (subdir)
        run: |
          npm --prefix airline-gui ci
          npm --prefix airline-gui test -- --coverage --watch=false --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reporter=json

      - name: Build and test C++ with coverage
        run: |
          bash scripts/verify

      - name: Generate C++ coverage report
        run: |
          python3 -m venv .venv-gcovr
          . .venv-gcovr/bin/activate
          python -m pip install --disable-pip-version-check gcovr
          mkdir -p coverage/cpp
          gcovr \
            --root . \
            --filter 'src' \
            --exclude 'tests' \
            --object-directory build \
            --merge-mode-functions=merge-use-line-min \
            --gcov-exclude-directory '.*/CMakeFiles/airline_api_server.dir/.*' \
            --gcov-exclude-directory '.*/CMakeFiles/airline_reservation_system.dir/.*' \
            --lcov coverage/cpp/lcov.info \
            --print-summary

      - name: Upload coverage reports to Codacy
        if: ${{ always() && env.CODACY_API_TOKEN != '' }}
        run: |
          report_args=()
          if [[ -f airline-gui/coverage/lcov.info ]]; then
            report_args+=(-r airline-gui/coverage/lcov.info)
          fi
          if [[ -f coverage/cpp/lcov.info ]]; then
            report_args+=(-r coverage/cpp/lcov.info)
          fi

          if [[ ${#report_args[@]} -eq 0 ]]; then
            echo "No Codacy coverage reports were generated." >&2
            exit 1
          fi

          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --api-token "${CODACY_API_TOKEN}" \
            --organization-provider "${CODACY_ORGANIZATION_PROVIDER}" \
            --username "${CODACY_USERNAME}" \
            --project-name "${CODACY_PROJECT_NAME}" \
            "${report_args[@]}" \
            --partial
          bash <(curl -Ls https://coverage.codacy.com/get.sh) final \
            --api-token "${CODACY_API_TOKEN}" \
            --organization-provider "${CODACY_ORGANIZATION_PROVIDER}" \
            --username "${CODACY_USERNAME}" \
            --project-name "${CODACY_PROJECT_NAME}"

      - name: Upload node coverage to Codecov
        if: ${{ always() && hashFiles('airline-gui/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ${{ github.workspace }}/airline-gui/coverage/lcov.info
          flags: node
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload cpp coverage to Codecov
        if: ${{ always() && hashFiles('coverage/cpp/lcov.info') != '' }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ${{ github.workspace }}/coverage/cpp/lcov.info
          flags: cpp
          disable_search: true
          fail_ci_if_error: true
          verbose: true
