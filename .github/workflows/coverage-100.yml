name: Coverage 100

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-100:
    name: Coverage 100 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'

      - name: Run node coverage (subdir)
        run: |
          npm --prefix airline-gui ci
          npm --prefix airline-gui test -- --coverage --watch=false

      - name: Build and test C++ with coverage
        run: |
          bash scripts/verify

      - name: Generate C++ coverage report
        run: |
          python3 -m venv .venv-gcovr
          . .venv-gcovr/bin/activate
          python -m pip install --disable-pip-version-check gcovr
          mkdir -p coverage/cpp
          gcovr \
            --root . \
            --filter 'src' \
            --exclude 'tests' \
            --object-directory build \
            --lcov coverage/cpp/lcov.info \
            --print-summary

      - name: Enforce 100% coverage
        run: |
          python3 -m scripts.quality.assert_coverage_100 --require-cpp

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-100
          path: |
            airline-gui/coverage
            coverage/cpp/lcov.info
            build/Testing
            coverage-100
