# CodeQL — ADVANCED configuration (fleet CODEQL DECISION).
# Runs BOTH suites — security-extended AND security-and-quality — which
# strictly subsumes the default suite and the extended suite. Matrix over
# every language this repository actually has (actions, c-cpp,
# javascript-typescript, python), one upload per language with a
# per-language category. The repo's own test/coverage suites (verify.yml,
# quality.yml) stay wired beside this workflow.
name: CodeQL

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      # Checkout the PR head commit (what the platform reusable does): with the
      # worktree on the head sha, analyze@v4.39.1 attributes the SARIF upload
      # to refs/pull/N/head at that commit, which the code-scanning red-blocker
      # ruleset accepts. The default merge-commit checkout attributes uploads
      # to the transient refs/pull/N/merge, which is rebuilt (new timestamp,
      # new sha) on every merge attempt, so the ruleset never sees them.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
