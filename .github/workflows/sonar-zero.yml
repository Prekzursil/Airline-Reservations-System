name: Sonar Zero

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar-zero:
    name: Sonar Zero
    runs-on: ubuntu-latest
    env:
      SC_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assert Sonar zero-open gate for PR scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m scripts.quality.check_sonar_zero \
            --project-key "Prekzursil_Airline-Reservations-System" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --expected-pr-sha "${{ github.event.pull_request.head.sha }}" \
            --token "${SC_TOKEN}"
      - name: Assert Sonar zero-open gate for repository scope
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python3 -m scripts.quality.check_sonar_zero \
            --project-key "Prekzursil_Airline-Reservations-System" \
            --branch "${{ github.ref_name }}" \
            --token "${SC_TOKEN}"
      - name: Upload Sonar artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-zero
          path: sonar-zero
