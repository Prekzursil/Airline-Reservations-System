name: Codacy Zero

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codacy-zero:
    name: Codacy Zero
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Assert Codacy PR analysis context is green
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m scripts.quality.check_required_checks \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${CHECK_SHA}" \
            --required-context "Codacy Static Code Analysis" \
            --timeout-seconds 1200 \
            --poll-seconds 20
      - name: Assert Codacy zero-open gate
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python3 -m scripts.quality.check_codacy_zero \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${GITHUB_REPOSITORY#*/}"
      - name: Upload Codacy artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-zero
          path: codacy-zero
