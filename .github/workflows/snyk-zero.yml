name: Snyk Zero

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-zero:
    name: Snyk Zero
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'

      - name: Set up .NET (SWFOC only)
        if: ${{ github.event.repository.name == 'SWFOC-Mod-Menu' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Validate token
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "Missing SNYK_TOKEN" >&2
            exit 1
          fi

      - name: Detect OSS scan strategy
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/detected-targets.txt

          repo="${REPO_NAME}"
          has_target=false
          oss_mode="skipped"
          skip_reason="unsupported_target_files"
          oss_cmd=""

          add_target() {
            printf '%s\n' "$1" >> artifacts/detected-targets.txt
          }

          if [ "$repo" = "env-inspector" ]; then
            if [ -f requirements-build.txt ]; then
              has_target=true
              oss_mode="executed"
              skip_reason=""
              oss_cmd="snyk test --file=requirements-build.txt --package-manager=pip --severity-threshold=low"
              add_target "requirements-build.txt"
            fi
          elif [ "$repo" = "SWFOC-Mod-Menu" ]; then
            if [ -f SwfocTrainer.sln ]; then
              dotnet restore SwfocTrainer.sln
            fi
            if find . -name project.assets.json -print -quit | grep -q .; then
              has_target=true
              oss_mode="executed"
              skip_reason=""
              oss_cmd="snyk test --all-projects --severity-threshold=low"
              add_target "project.assets.json"
            fi
          elif [ "$repo" = "Star-Wars-Galactic-Battlegrounds-Save-Game-Editor" ]; then
            has_target=false
            oss_mode="skipped"
            skip_reason="unsupported_target_files"
          else
            if find . -maxdepth 5 \
              \( -name package-lock.json -o -name yarn.lock -o -name pnpm-lock.yaml -o -name package.json \
                 -o -name requirements.txt -o -name 'requirements-*.txt' -o -name pyproject.toml \
                 -o -name Pipfile -o -name poetry.lock -o -name go.mod -o -name pom.xml \
                 -o -name build.gradle -o -name build.gradle.kts -o -name gradle.lockfile \
                 -o -name '*.csproj' -o -name '*.sln' -o -name Gemfile -o -name Cargo.toml \
              \) -print -quit | grep -q .; then
              has_target=true
              oss_mode="executed"
              skip_reason=""
              oss_cmd="snyk test --all-projects --severity-threshold=low"
              while IFS= read -r f; do
                add_target "$f"
              done < <(find . -maxdepth 5 \
                \( -name package-lock.json -o -name yarn.lock -o -name pnpm-lock.yaml -o -name package.json \
                   -o -name requirements.txt -o -name 'requirements-*.txt' -o -name pyproject.toml \
                   -o -name Pipfile -o -name poetry.lock -o -name go.mod -o -name pom.xml \
                   -o -name build.gradle -o -name build.gradle.kts -o -name gradle.lockfile \
                   -o -name '*.csproj' -o -name '*.sln' -o -name Gemfile -o -name Cargo.toml \
                \) -print | sort | head -n 100)
            fi
          fi

          echo "has_target=${has_target}" >> "$GITHUB_OUTPUT"
          echo "oss_mode=${oss_mode}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          {
            echo 'oss_cmd<<EOF'
            echo "$oss_cmd"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Snyk OSS test
        id: oss
        if: ${{ steps.detect.outputs.has_target == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          oss_cmd="${{ steps.detect.outputs.oss_cmd }}"
          bash -lc "$oss_cmd" 2>&1 | tee artifacts/snyk-oss.log
          rc=$?
          if grep -qiE 'test limit reached|used your limit|billing period|quota|monthly' artifacts/snyk-oss.log; then
            echo "oss_quota=true" >> "$GITHUB_OUTPUT"
          else
            echo "oss_quota=false" >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - name: Snyk code test
        id: code
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --severity-threshold=low 2>&1 | tee artifacts/snyk-code.log
          rc=$?
          if grep -qiE 'code test limit reached|test limit reached|used your limit|billing period|quota|monthly' artifacts/snyk-code.log; then
            echo "code_quota=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_quota=false" >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - name: Build snyk-oss-mode.json and enforce failure policy
        id: finalize
        if: ${{ always() }}
        env:
          HAS_TARGET: ${{ steps.detect.outputs.has_target }}
          OSS_MODE: ${{ steps.detect.outputs.oss_mode }}
          SKIP_REASON: ${{ steps.detect.outputs.skip_reason }}
          OSS_OUTCOME: ${{ steps.oss.outcome }}
          OSS_QUOTA: ${{ steps.oss.outputs.oss_quota }}
          CODE_OUTCOME: ${{ steps.code.outcome }}
          CODE_QUOTA: ${{ steps.code.outputs.code_quota }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          detected_path = Path('artifacts/detected-targets.txt')
          detected = []
          if detected_path.exists():
              for line in detected_path.read_text().splitlines():
                  line = line.strip()
                  if line:
                      detected.append(line)

          has_target = os.getenv('HAS_TARGET', '').lower() == 'true'
          oss_mode = os.getenv('OSS_MODE') or ('executed' if has_target else 'skipped')
          skip_reason = os.getenv('SKIP_REASON', '')
          oss_outcome = os.getenv('OSS_OUTCOME') or ('skipped' if not has_target else 'failure')
          code_outcome = os.getenv('CODE_OUTCOME') or 'failure'
          oss_quota = os.getenv('OSS_QUOTA', '').lower() == 'true'
          code_quota = os.getenv('CODE_QUOTA', '').lower() == 'true'

          def read_text(path):
              p = Path(path)
              if not p.exists():
                  return ''
              return p.read_text(encoding='utf-8', errors='ignore').lower()

          def has_findings(log_text):
              markers = (
                  'issues found',
                  'vulnerabilities',
                  'vulnerability',
                  'problem id',
              )
              return any(marker in log_text for marker in markers)

          oss_log = read_text('artifacts/snyk-oss.log')
          code_log = read_text('artifacts/snyk-code.log')

          quota_detected = oss_quota or code_quota
          findings_detected = (
              (has_target and oss_outcome != 'success' and has_findings(oss_log))
              or (code_outcome != 'success' and has_findings(code_log))
          )
          runtime_error_detected = (
              (has_target and oss_outcome != 'success' and not oss_quota and not has_findings(oss_log))
              or (code_outcome != 'success' and not code_quota and not has_findings(code_log))
          )

          decision = 'pass'
          decision_reason = 'clean'
          if quota_detected:
              decision = 'pass'
              decision_reason = 'quota_exhausted'
          elif findings_detected:
              decision = 'fail'
              decision_reason = 'findings_detected'
          elif runtime_error_detected:
              decision = 'fail'
              decision_reason = 'runtime_error'

          payload = {
              'oss_mode': oss_mode,
              'detected_targets': detected,
              'skip_reason': skip_reason,
              'code_scan_executed': True,
              'quota_detected': quota_detected,
              'findings_detected': findings_detected,
              'runtime_error_detected': runtime_error_detected,
              'oss_outcome': oss_outcome,
              'oss_quota': oss_quota,
              'code_outcome': code_outcome,
              'code_quota': code_quota,
              'decision': decision,
              'decision_reason': decision_reason,
              'result': decision,
          }

          out = Path('artifacts/snyk-oss-mode.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload, indent=2))

          if decision != 'pass':
              raise SystemExit(1)
          PY

      - name: Upload Snyk mode artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snyk-oss-mode
          path: |
            artifacts/snyk-oss-mode.json
            artifacts/detected-targets.txt
            artifacts/snyk-oss.log
            artifacts/snyk-code.log
