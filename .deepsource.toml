version = 1

# Keep this file explicit so provider-side analysis re-reads repo scope changes.

exclude_patterns = [
  "airline-gui/coverage/**",
  "airline-gui/dist/**",
  "airline-gui/build/**",
  "airline-gui/node_modules/**",
  "tests/**",
  "scripts/quality/**",
  ".github/**",
  ".qlty/**",
  "build/**",
]

test_patterns = [
  "airline-gui/src/**/*.test.js",
  "airline-gui/src/**/*.test.jsx",
  "airline-gui/src/setupTests.js",
  "airline-gui/scripts/**/*.node-test.cjs",
  "tests/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  dependency_file_paths = ["airline-gui"]
  environment = ["nodejs", "browser", "vitest"]
  skip_doc_coverage = [
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "function-declaration",
    "function-expression",
    "method-definition",
  ]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 180
  skip_doc_coverage = ["module", "magic", "init", "class", "nonpublic"]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "cxx"
enabled = true

[[analyzers]]
name = "go"
enabled = true

  [analyzers.meta]
  import_root = "github.com/Prekzursil/Airline-Reservations-System"
