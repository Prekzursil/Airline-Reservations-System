# GuardRails configuration
# Reference: https://docs.guardrails.io/docs/configuration
#
# Bounds the org-installed GuardRails App's scan to source code so its
# status check converges. All analyzers stay enabled with default
# rules; no findings are silenced.

version: 1

ignore-paths:
  - build
  - coverage
  - docs
  - airline-gui/build
  - airline-gui/dist
  - airline-gui/coverage
  - airline-gui/node_modules
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "tests/**"
  - "airline-gui/src/**/*.test.js"
  - "airline-gui/src/**/*.test.jsx"

engines:
  python:
    enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
  javascript:
    enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
  cpp:
    enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
  general:
    secrets:
      enabled: true
    vulnerable_dependencies:
      enabled: true
