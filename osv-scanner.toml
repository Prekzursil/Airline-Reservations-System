# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --recursive .` and must report 0
# actionable CVEs. Lockfile scanned: airline-gui/package-lock.json.
#
# POLICY: clean-zero is reached by UPGRADING where a safe fix exists; an
# IgnoredVulns entry is allowed ONLY for a genuinely-unfixable vuln or one
# provably unreachable in this product, each with a reason + dated note.
# We do NOT use a baseline file.
#
# ---------------------------------------------------------------------------
# 2026-06-17 SECURITY UPGRADE — the 8 npm CVEs osv reported at lean-gate
# adoption (vite, vitest, @babel/core, brace-expansion, esbuild, ws — all dev
# deps) were RETIRED by performing the upgrades, not by ignoring them:
#   - vite 7.3.2 -> 7.3.5, vitest 3.2.4 -> 3.2.6, @vitest/coverage-v8 -> 3.2.6
#     (direct devDependency bumps)
#   - @babel/core -> ^7.29.6, brace-expansion -> ^5.0.6, esbuild -> ^0.28.1,
#     ws -> ^8.21.0 (transitive, forced via package.json "overrides")
# osv-scanner now reports 0 issues with NO ignores, so this file intentionally
# carries no IgnoredVulns. Add a dated, reasoned entry here only for a future
# vuln that is genuinely unfixable or provably unreachable.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 2026-11-18 RESIDUAL RISK (reasoned ignore) — GHSA-fc5q-39xc-vjpf, picomatch
# ReDoS (CVSS v3 7.5 / v4 8.7, availability-only; analyzeRepeatedExtglob
# exponential backtracking). Vulnerable range <= 4.0.7 and 4.0.7 IS the newest
# published release (measured 2026-11-18 via `npm view picomatch versions`),
# so no fixed release exists to upgrade to — the gate's own output says
# "0 vulnerabilities can be fixed". Measured scope in THIS tree: the single
# resolution is airline-gui/package-lock.json picomatch 4.0.7 (dev=true) via
# tinyglobby ^4.0.4 / vite ^4.0.2 / vitest ^4.0.3 (build+test toolchain only);
# picomatch never ships in the GUI bundle. Impact ceiling is event-loop
# blockage in a developer's own test run from a crafted glob pattern.
# RE-CHECK: retire the day a patched picomatch (> 4.0.7) publishes and bump
# the floor instead. Re-review at ignoreUntil regardless.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-18
reason = """
picomatch ReDoS; every published release is vulnerable (<= 4.0.7 = latest
published, measured 2026-11-18), so no upgrade exists. Dev-scope only: the
sole resolution is airline-gui dev=true via tinyglobby/vite/vitest and it
never ships in the GUI bundle. Availability-only impact. Retire as soon as
a patched picomatch publishes.
"""
