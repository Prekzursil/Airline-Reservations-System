---
engines:
  cppcheck:
    language: c++
    include_paths:
      - "src"
      - "tests"
      - "build/_deps/cpp_httplib-src"
      - "build/_deps/nlohmann_json-src/include"
      - "build/_deps/googletest-src/googletest/include"
      - "build/_deps/googletest-src/googlemock/include"

languages:
  markdown:
    enabled: false
  c:
    enabled: false

exclude_paths:
  - "**/*.md"
  - "README.md"
  - "AGENTS.md"
  - ".github/*.md"
  - "cline_docs/**"
  - ".github/agents/**"
  - ".github/BRANCH_POLICY.md"
  - ".github/BRANCH_PROTECTION.md"
  - "airline-gui/package-lock.json"
  - "airline-gui/**"
  - "scripts/**"
  - "tests/test_quality_security_scripts.py"
